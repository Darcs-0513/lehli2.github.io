  <main class="container mt-5" id="carrito-contenedor">
    <h2>🛒 Tu carrito de compras</h2>
    <div id="carrito-items"></div>
   <div class="mt-4 d-flex flex-column align-items-end gap-1" id="resumen-carrito">

    <div class="resumen-envio mt-2 w-100">
  <label class="form-label mb-1">Método de envío</label>
  <div class="form-check">
    <input class="form-check-input" type="radio" name="metodoEnvio" id="envio-postal" value="postal">
    <label class="form-check-label" for="envio-postal">Envío postal (se suma costo por artículo)</label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="radio" name="metodoEnvio" id="envio-tienda" value="tienda">
    <label class="form-check-label" for="envio-tienda">Recogida en tienda (gratis)</label>
  </div>
</div>



  <div class="resumen-line">
    <span>Subtotal:</span>
    <strong>₡<span id="subtotal-carrito">0</span></strong>
  </div>

  <div class="resumen-line">
    <span>Envío:</span>
    <strong>₡<span id="envio-carrito">0</span></strong>
    <small id="envio-nota" class="text-muted ms-2"></small>
  </div>

  <div class="resumen-line fs-5">
    <span>Total a pagar:</span>
    <strong>₡<span id="total-carrito">0</span></strong>
  </div>

  <button class="btn btn-success ms-0 mt-2">Finalizar compra</button>
</div>
